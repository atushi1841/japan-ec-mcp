name: Publish to MCP Registry

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "server.json を publish する"
        type: boolean
        default: true
      deprecate_version:
        description: "deprecated する旧バージョン（空なら何もしない）"
        type: string
        default: ""
      status_version:
        description: "status を変更するバージョン（空なら何もしない）"
        type: string
        default: ""
      status_value:
        description: "status_version に設定する値 (active|deprecated|deleted)"
        type: string
        default: ""

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz" -o /tmp/mcp-publisher.tar.gz
          tar -xzf /tmp/mcp-publisher.tar.gz -C /tmp mcp-publisher
          sudo mv /tmp/mcp-publisher /usr/local/bin/mcp-publisher
          mcp-publisher --version

      - name: Authenticate (GitHub OIDC)
        run: mcp-publisher login github-oidc

      - name: Publish server.json
        if: ${{ inputs.publish }}
        run: mcp-publisher publish

      - name: Deprecate an old version
        if: ${{ inputs.deprecate_version != '' }}
        run: |
          mcp-publisher status --status deprecated \
            --message "旧版（懸賞ツールを含む）。最新版を使用してください。" \
            io.github.atushi1841/japan-ec-mcp ${{ inputs.deprecate_version }}

      - name: Set version status (active/deprecated/deleted)
        if: ${{ inputs.status_version != '' && inputs.status_value != '' }}
        run: |
          mcp-publisher status --status ${{ inputs.status_value }} \
            --message "懸賞ツールを含む旧版のため非公開化" \
            io.github.atushi1841/japan-ec-mcp ${{ inputs.status_version }}
